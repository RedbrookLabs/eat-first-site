name: Update shelf-life data

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the list from USDA FoodKeeper
        run: python3 scripts/build_shelf_life.py
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No changes."
            exit 0
          fi
          BRANCH="data-update-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data
          git commit -m "Update shelf-life data from USDA FoodKeeper"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Update shelf-life data" \
            --body "Automated refresh from USDA FoodKeeper. Read the diff. Merging publishes it to the app within a day."
